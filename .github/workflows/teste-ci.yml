name: Teste CI - Cypress

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
    - name: Instalar Dependências
      run: npm install
    - name: Corrigir Vulnerabilidades
      run: npm audit fix
    - name: Executar Testes Cypress
      run: npm test
